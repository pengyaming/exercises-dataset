<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff4f00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健身动作库">
<meta name="description" content="快速、可离线浏览的中文健身动作库">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<title>健身动作库</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f4;color:#18181b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e4e4e7;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h1{font-size:20px;margin:0}.accent{color:#ff4f00}.count{color:#71717a;font-size:12px}
.search{width:100%;border:1px solid #d4d4d8;border-radius:12px;background:#f4f4f5;padding:11px 12px;font-size:16px;outline:none}.search:focus{border-color:#ff4f00}
.filters{display:flex;gap:8px;margin-top:8px;overflow:auto}.filters select{min-width:112px;border:1px solid #e4e4e7;border-radius:10px;background:#fff;padding:8px}
main{padding:12px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid #e4e4e7;border-radius:14px;background:#fff;overflow:hidden;text-align:left;padding:0;box-shadow:0 1px 2px #0000000a}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fafafa}.card-body{padding:10px}.card-name{font-weight:700;line-height:1.3;min-height:36px}.meta{font-size:12px;color:#71717a;margin-top:5px}
.more{display:block;margin:18px auto;padding:11px 28px;border:0;border-radius:12px;background:#18181b;color:#fff;font-weight:700}.empty{text-align:center;color:#71717a;padding:50px 10px}
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:620px;max-height:92dvh;margin:auto auto 0;box-shadow:0 -10px 40px #0003}dialog::backdrop{background:#0009}.modal{padding:16px 16px calc(22px + env(safe-area-inset-bottom));overflow:auto;max-height:92dvh}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:19px}.modal h2{margin:4px 42px 12px 0;font-size:20px}.gif{width:100%;max-height:300px;object-fit:contain;background:#fafafa;border-radius:12px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{background:#fff0e9;color:#b93800;border-radius:999px;padding:5px 9px;font-size:12px}.steps{padding:0;list-style:none}.steps li{display:flex;gap:10px;margin:12px 0}.num{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#ff4f00;color:#fff;font-weight:700}
.loading{text-align:center;padding:60px 10px;color:#71717a}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>健身<span class="accent">动作库</span></h1><span id="count" class="count">正在加载…</span></div>
  <input id="search" class="search" type="search" placeholder="搜索英文动作名、部位或器械…" autocomplete="off">
  <div class="filters"><select id="part"><option value="">全部部位</option></select><select id="equipment"><option value="">全部器械</option></select></div>
</header>
<main><div id="loading" class="loading">正在加载中文动作数据…</div><div id="grid" class="grid"></div><button id="more" class="more" hidden>加载更多</button></main>
<dialog id="detail"><div class="modal"><button id="close" class="close" aria-label="关闭">×</button><h2 id="title"></h2><img id="gif" class="gif" alt=""><div id="tags" class="tags"></div><h3>动作步骤</h3><ol id="steps" class="steps"></ol></div></dialog>
<script>
const FILES=Array.from({length:8},(_,i)=>'./data/mobile-zh-'+(i+1)+'.json');
const ZH={'upper arms':'上臂','upper legs':'大腿','lower arms':'前臂','lower legs':'小腿','back':'背部','waist':'腰腹','chest':'胸部','shoulders':'肩部','cardio':'有氧','neck':'颈部','body weight':'徒手','dumbbell':'哑铃','barbell':'杠铃','cable':'绳索','band':'弹力带','kettlebell':'壶铃','weighted':'负重','stability ball':'健身球','leverage machine':'固定器械','smith machine':'史密斯机','ez barbell':'曲杆杠铃'};
let all=[],filtered=[],shown=0;
const $=id=>document.getElementById(id);
const label=x=>ZH[x]||x;
function options(id,key,first){const s=$(id);[...new Set(all.map(x=>x[key]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=label(v);s.append(o)})}
function apply(){const q=$('search').value.trim().toLowerCase(),p=$('part').value,e=$('equipment').value;filtered=all.filter(x=>(!q||[x.name,x.body_part,x.equipment,x.target].join(' ').toLowerCase().includes(q))&&(!p||x.body_part===p)&&(!e||x.equipment===e));shown=0;$('grid').replaceChildren();render()}
function render(){const end=Math.min(shown+30,filtered.length),frag=document.createDocumentFragment();for(let i=shown;i<end;i++){const x=filtered[i],b=document.createElement('button');b.className='card';b.innerHTML='<img loading="lazy" decoding="async" src="'+x.image+'" alt=""><div class="card-body"><div class="card-name"></div><div class="meta"></div></div>';b.querySelector('.card-name').textContent=x.name;b.querySelector('.meta').textContent=label(x.body_part)+' · '+label(x.equipment);b.onclick=()=>openDetail(x);frag.append(b)}$('grid').append(frag);shown=end;$('count').textContent='共 '+filtered.length+' 个动作';$('more').hidden=shown>=filtered.length;if(!filtered.length)$('grid').innerHTML='<div class="empty">没有找到匹配动作</div>'}
function openDetail(x){$('title').textContent=x.name;$('gif').src=x.gif_url;$('gif').alt=x.name;$('tags').replaceChildren();[['部位',label(x.body_part)],['器械',label(x.equipment)],['目标',label(x.target)]].forEach(([k,v])=>{const t=document.createElement('span');t.className='tag';t.textContent=k+'：'+v;$('tags').append(t)});$('steps').replaceChildren();(x.steps.length?x.steps:['暂无中文步骤']).forEach((s,i)=>{const li=document.createElement('li'),n=document.createElement('span'),t=document.createElement('span');n.className='num';n.textContent=i+1;t.textContent=s;li.append(n,t);$('steps').append(li)});$('detail').showModal()}
$('search').oninput=apply;$('part').onchange=apply;$('equipment').onchange=apply;$('more').onclick=render;$('close').onclick=()=>{$('detail').close();$('gif').removeAttribute('src')};$('detail').onclick=e=>{if(e.target===$('detail'))$('close').click()};
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}))).then(parts=>{all=parts.flat();$('loading').remove();options('part','body_part');options('equipment','equipment');apply()}).catch(()=>{$('loading').textContent='加载失败，请检查网络后刷新页面。'});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body>
</html>
